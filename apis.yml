name: Lola
description: 'Lola is a consumer travel booking platform at lola.com that lets travelers
  discover, compare, and book flights, hotels, and trips in one place, built around
  insider access to the world''s leading travel brands, competitive rates, and a simple
  "just ask" booking experience. The lola.com domain was previously the Boston-based
  corporate travel and expense-management startup founded by Kayak veterans Paul English
  and Bill O''Donnell (backed by Accel and GV, more than $80M raised) which wound down
  operations in 2021 with its technology acquired by Capital One; the domain now hosts
  this new consumer travel product. No public API or developer program is currently
  published — this profile captures the provider''s public web and security posture.'
